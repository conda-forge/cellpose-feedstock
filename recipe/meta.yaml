{% set name = "cellpose" %}
{% set version = "4.2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cellpose-{{ version }}.tar.gz
  sha256: 229eedea3977184202b2c87b3bd41c609facd742c7203bb4ad3cebd7b6bc6839

build:
  entry_points:
    - cellpose = cellpose.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - pytest-runner
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - segment-anything  # Note: The conda-forge package is based on the PyPI 'segment-anything-py', not 'segment-anything'
    - fastremap
    - fill-voids
    - imagecodecs
    - matplotlib-base  # Imported but not declared as a dependency
    - natsort
    - numpy >=1.20.0
    - opencv
    - python >={{ python_min }}
    - pytorch >=1.6
    - roifile
    - scikit-image    # Imported but not declared as a dependency
    - scipy
    - tifffile
    - torchvision
    - tqdm
    # GUI Dependencies
    - pyside6
    - pyqtgraph >=0.12.4
    - qtpy
    - superqt
    # Distributed Dependencies
    - bokeh
    - dask-core
    - dask-image
    - dask-jobqueue
    - distributed
    - pyarrow
    - pyyaml
    - zarr

test:
  imports:
    - cellpose
    - cellpose.core
  commands:
    - pip list
    # - pip check  # Fails due to opencv-python-headless
    - cellpose --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/cellpose
  summary: anatomical segmentation algorithm
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/MouseLand/cellpose

extra:
  recipe-maintainers:
    - goanpeca
    - carsen-stringer
    - mrariden
    - stuarteberg
